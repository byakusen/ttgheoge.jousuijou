<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浄水場 〜水ができるまで ものしり問答〜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Zen+Maru+Gothic:wght@500;700;900&family=Klee+One:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --mizu:#1c8fc4;        /* 水色 */
    --mizu-fuka:#0e5f88;   /* 深い水色 */
    --mizu-akarui:#7fd0ec; /* 明るい水色 */
    --sora:#dff1fb;        /* 空色 */
    --shiro:#f3fbff;       /* しろ（紙） */
    --shiro-kage:#dceef8;
    --midori:#4caf8a;      /* みどり（さわやか） */
    --sumi:#123443;        /* 文字の色 */
    --sumi-usu:rgba(255,255,255,.78);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    font-family:'Zen Maru Gothic',sans-serif;
    background:
      radial-gradient(ellipse at 50% -10%, #6fc4e8 0%, transparent 55%),
      radial-gradient(ellipse at 50% 120%, #bfe6f6 0%, transparent 55%),
      linear-gradient(180deg,#9fd6ef,#cdeafa);
    color:var(--sumi);
    min-height:100%;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
    position:relative;
  }
  /* 水面のさざなみ風テクスチャ */
  body::before{
    content:"";
    position:fixed;inset:0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,.06) 0 1px, transparent 1px 5px);
    pointer-events:none;z-index:0;
  }

  /* ヘッダー */
  header{
    position:relative;z-index:2;
    text-align:center;
    padding:18px 16px 12px;
    border-bottom:4px solid #fff;
    background:linear-gradient(180deg, rgba(28,143,196,.92), rgba(14,95,136,.92));
    box-shadow:0 4px 18px rgba(14,95,136,.35);
  }
  .mon{
    display:inline-flex;align-items:center;gap:14px;
  }
  .mon-maru{
    width:46px;height:46px;border-radius:50%;
    border:3px solid #fff;
    display:grid;place-items:center;
    font-family:'Mochiy Pop One',sans-serif;font-size:22px;color:#fff;
    background:radial-gradient(circle,#3eb0dd,#1c8fc4);
    box-shadow:0 2px 8px rgba(0,0,0,.2);
  }
  h1{
    font-family:'Mochiy Pop One',sans-serif;
    font-size:clamp(24px,4vw,46px);
    color:#fff;
    letter-spacing:.06em;
    text-shadow:0 2px 0 rgba(14,95,136,.6),0 0 16px rgba(255,255,255,.4);
  }
  .sub{
    font-size:clamp(13px,1.5vw,18px);
    color:var(--sumi-usu);
    margin-top:6px;letter-spacing:.14em;
  }

  /* メイン */
  main{
    position:relative;z-index:2;
    flex:1;
    width:min(1100px,94vw);
    margin:0 auto;
    padding:22px 0 30px;
    display:flex;flex-direction:column;gap:20px;
  }

  /* 語り場 */
  .stage{
    display:flex;align-items:flex-start;gap:22px;
  }
  .person{
    flex:0 0 auto;
    width:clamp(120px,15vw,180px);
    text-align:center;
  }
  .face{
    width:clamp(120px,15vw,180px);
    height:clamp(120px,15vw,180px);
    border-radius:50%;
    overflow:hidden;
    background:#eaf6fc;
    border:5px solid #fff;
    box-shadow:0 0 0 4px var(--mizu),0 10px 28px rgba(14,95,136,.45);
    position:relative;
    transition:transform .25s;
  }
  .face .mouth{
    position:absolute;inset:0;
    width:100%;height:100%;
    object-fit:cover;
    display:block;
  }
  .face .mouth.closed{z-index:1;}
  .face .mouth.open{z-index:2;opacity:0;}   /* ふだんは閉じた口。話すとき重ねて見せる */
  .face.talking-open .mouth.open{opacity:1;}
  .face.no-img .mouth{display:none;}
  .face-fallback{
    display:none;
    position:absolute;inset:0;z-index:3;
    width:100%;height:100%;
    align-items:center;justify-content:center;
    font-family:'Mochiy Pop One',sans-serif;
    font-size:clamp(16px,2.2vw,26px);line-height:1.2;
    color:var(--mizu-fuka);letter-spacing:.02em;text-align:center;
    background:radial-gradient(circle at 50% 38%, #eaf6fc, #cfe9f6);
  }
  .face.no-img .face-fallback{display:flex;}
  .name-tag{
    margin-top:10px;font-family:'Zen Maru Gothic',sans-serif;font-weight:900;
    font-size:clamp(15px,1.9vw,22px);color:var(--mizu-fuka);letter-spacing:.06em;
  }

  /* 吹き出し */
  .scroll{
    flex:1;position:relative;
    background:linear-gradient(180deg,var(--shiro),var(--shiro-kage));
    color:var(--sumi);
    border-radius:18px;
    padding:26px 30px;
    min-height:170px;
    box-shadow:0 12px 30px rgba(14,95,136,.30),inset 0 0 0 3px rgba(28,143,196,.18);
    border:3px solid #fff;
  }
  .scroll::before{ /* 吹き出しのしっぽ */
    content:"";position:absolute;left:-18px;top:48px;
    border-style:solid;border-width:14px 18px 14px 0;
    border-color:transparent #fff transparent transparent;
  }
  .scroll .answer{
    font-family:'Klee One',serif;
    font-size:clamp(19px,2.5vw,30px);
    line-height:1.8;font-weight:600;
    letter-spacing:.01em;
  }
  .scroll .answer .em{color:var(--mizu-fuka);font-weight:700;}

  /* 質問エリア */
  .ask-zone{
    background:rgba(255,255,255,.82);
    border:3px solid #fff;
    border-radius:18px;
    padding:18px 20px;
    box-shadow:0 8px 22px rgba(14,95,136,.22);
  }
  .ask-zone .label{
    font-size:clamp(15px,1.7vw,20px);color:var(--mizu-fuka);
    margin-bottom:12px;letter-spacing:.06em;font-weight:900;
  }
  .input-row{display:flex;gap:12px;flex-wrap:wrap;}
  #q{
    flex:1;min-width:220px;
    font-family:'Zen Maru Gothic',sans-serif;
    font-size:clamp(18px,2.2vw,26px);font-weight:500;
    padding:14px 18px;border-radius:12px;border:2px solid var(--mizu-akarui);
    background:#fff;color:var(--sumi);
  }
  #q:focus{outline:3px solid var(--mizu);}
  .btn-ask{
    font-family:'Mochiy Pop One',sans-serif;
    font-size:clamp(17px,2.1vw,24px);
    padding:14px 28px;border:none;border-radius:12px;cursor:pointer;
    background:linear-gradient(180deg,#2aa6dd,#1577a8);
    color:#fff;letter-spacing:.06em;
    box-shadow:0 4px 0 #0e5f88,0 6px 14px rgba(14,95,136,.4);
    transition:transform .08s;
  }
  .btn-ask:active{transform:translateY(4px);box-shadow:0 1px 0 #0e5f88;}

  /* おすすめ問い */
  .topics{margin-top:2px;}
  .topics .t-label{font-size:clamp(13px,1.5vw,17px);color:var(--mizu-fuka);margin:6px 2px 12px;letter-spacing:.04em;font-weight:700;}
  .chips{display:flex;flex-wrap:wrap;gap:10px;}
  .chip{
    font-family:'Zen Maru Gothic',sans-serif;font-weight:700;
    font-size:clamp(14px,1.7vw,19px);
    padding:10px 18px;border-radius:999px;cursor:pointer;
    background:rgba(255,255,255,.7);
    color:var(--mizu-fuka);
    border:2px solid var(--mizu);
    transition:all .15s;
  }
  .chip:hover{background:var(--mizu);color:#fff;transform:translateY(-2px);}

  /* 顔のリアクション */
  .face.seikai{box-shadow:0 0 0 4px var(--mizu),0 0 34px 8px rgba(127,208,236,.95),0 10px 28px rgba(14,95,136,.45);}

  footer{
    position:relative;z-index:2;text-align:center;
    font-size:13px;color:rgba(255,255,255,.85);
    padding:14px;letter-spacing:.06em;
    text-shadow:0 1px 2px rgba(14,95,136,.4);
  }
  @media(max-width:560px){
    .stage{flex-direction:column;align-items:center;}
    .scroll::before{display:none;}
    .person{order:-1;}
  }

  /* ===== モード切りかえタブ ===== */
  .tabs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:4px;}
  .tab{
    font-family:'Zen Maru Gothic',sans-serif;font-weight:900;
    font-size:clamp(14px,1.8vw,20px);
    padding:10px 20px;border-radius:999px;cursor:pointer;
    background:rgba(255,255,255,.55);color:var(--mizu-fuka);
    border:2px solid #fff;box-shadow:0 3px 10px rgba(14,95,136,.18);
    transition:all .15s;
  }
  .tab:hover{transform:translateY(-2px);}
  .tab.active{
    background:linear-gradient(180deg,#2aa6dd,#1577a8);color:#fff;border-color:#fff;
    box-shadow:0 4px 0 #0e5f88,0 6px 14px rgba(14,95,136,.4);
  }

  .panel{display:none;}
  .panel.show{display:block;}

  /* ===== クイズ・ながれ・たび 共通の箱 ===== */
  .quiz-zone,.flow-zone,.journey-zone{
    background:rgba(255,255,255,.82);border:3px solid #fff;border-radius:18px;
    padding:20px;box-shadow:0 8px 22px rgba(14,95,136,.22);
  }

  /* ===== クイズ ===== */
  .quiz-status{
    display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
    font-weight:900;color:var(--mizu-fuka);
    font-size:clamp(15px,1.8vw,20px);margin-bottom:14px;
  }
  .quiz-choices{display:flex;flex-direction:column;gap:12px;}
  .choice{
    font-family:'Zen Maru Gothic',sans-serif;font-weight:700;
    font-size:clamp(16px,2vw,23px);text-align:left;
    padding:14px 20px;border-radius:14px;cursor:pointer;
    background:#fff;color:var(--sumi);border:3px solid var(--mizu-akarui);
    transition:all .12s;
  }
  .choice:hover:not(:disabled){background:var(--sora);transform:translateY(-2px);}
  .choice:disabled{cursor:default;opacity:.96;}
  .choice.correct{background:#d6f5e4;border-color:#3fb37a;color:#1c6b46;}
  .choice.wrong{background:#fadcdc;border-color:#d07070;color:#8a2f2f;}
  .quiz-next,.flow-btn,.journey-btn{
    font-family:'Mochiy Pop One',sans-serif;font-size:clamp(15px,1.9vw,22px);
    padding:13px 26px;border:none;border-radius:12px;cursor:pointer;
    background:linear-gradient(180deg,#2aa6dd,#1577a8);color:#fff;
    box-shadow:0 4px 0 #0e5f88,0 6px 14px rgba(14,95,136,.4);
    transition:transform .08s;margin-top:16px;
  }
  .quiz-next:active,.journey-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0e5f88;}
  .quiz-next.hidden{display:none;}

  /* ===== ながれ図 ===== */
  .flow-track{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch;justify-content:center;}
  .flow-step{
    flex:1 1 100px;max-width:150px;border-radius:14px;cursor:pointer;
    background:#fff;border:3px solid var(--mizu-akarui);
    padding:12px 8px;text-align:center;transition:all .15s;
  }
  .flow-step:hover{transform:translateY(-3px);}
  .flow-step.active{background:var(--mizu);border-color:#fff;color:#fff;box-shadow:0 6px 16px rgba(14,95,136,.4);}
  .flow-step .num{
    display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;
    background:var(--mizu);color:#fff;font-weight:900;font-size:14px;margin-bottom:6px;
  }
  .flow-step.active .num{background:#fff;color:var(--mizu);}
  .flow-step .nm{font-family:'Zen Maru Gothic',sans-serif;font-weight:900;font-size:clamp(13px,1.6vw,17px);line-height:1.3;}
  .water-sample{margin-top:20px;display:flex;flex-direction:column;align-items:center;gap:10px;}
  .glass{
    width:84px;height:104px;border-radius:8px 8px 16px 16px;
    border:4px solid #cfe9f6;border-top:none;overflow:hidden;position:relative;background:#fff;
  }
  .glass .liquid{position:absolute;left:0;right:0;bottom:0;height:80%;background:#9c7b4a;transition:background .5s;}
  .sample-label{font-weight:900;color:var(--mizu-fuka);font-size:clamp(15px,1.9vw,21px);}

  /* ===== 水のたび ===== */
  .journey-zone{text-align:center;}
  .journey-progress{font-weight:900;color:var(--mizu-fuka);margin-bottom:8px;font-size:clamp(14px,1.7vw,19px);}
  .journey-scene{font-size:clamp(46px,9vw,68px);line-height:1.1;margin:6px 0 14px;}
  .journey-controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
  .journey-btn.ghost{background:#fff;color:var(--mizu-fuka);border:3px solid var(--mizu);box-shadow:0 4px 0 #cfe9f6;}

  /* ながれ図の イラスト */
  .flow-fig{margin:0 0 14px;text-align:center;}
  .flow-img-wrap{position:relative;display:inline-block;width:100%;max-width:820px;line-height:0;}
  .flow-img-wrap img{display:block;width:100%;height:auto;border-radius:12px;border:3px solid #fff;box-shadow:0 6px 16px rgba(14,95,136,.25);background:#fff;}
  .flow-pin{
    position:absolute;top:5px;transform:translateX(-50%);
    width:clamp(20px,3.2vw,28px);height:clamp(20px,3.2vw,28px);border-radius:50%;
    display:grid;place-items:center;font-family:inherit;font-weight:900;
    font-size:clamp(11px,1.8vw,15px);line-height:1;padding:0;cursor:pointer;
    background:#fff;color:var(--mizu-fuka);border:2px solid var(--mizu);
    box-shadow:0 2px 6px rgba(0,0,0,.3);z-index:3;transition:all .15s;
  }
  .flow-pin:hover{transform:translateX(-50%) scale(1.12);}
  .flow-pin.active{background:var(--mizu);color:#fff;transform:translateX(-50%) scale(1.3);box-shadow:0 0 0 4px rgba(127,208,236,.75),0 2px 6px rgba(0,0,0,.3);}
  .flow-band{position:absolute;top:0;height:100%;background:rgba(255,212,84,.32);border-left:3px dashed #e6a700;border-right:3px dashed #e6a700;display:none;z-index:2;pointer-events:none;}
  .flow-band.show{display:block;}
  .flow-band-label{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);white-space:nowrap;background:var(--mizu-fuka);color:#fff;font-weight:900;font-size:clamp(12px,1.8vw,18px);padding:6px 12px;border-radius:999px;box-shadow:0 3px 10px rgba(0,0,0,.4);line-height:1.1;}
  .flow-fig figcaption{font-size:clamp(11px,1.4vw,15px);color:var(--mizu-fuka);margin-top:8px;font-weight:700;line-height:1.5;}

  /* 水のたび：イラスト上を動く しずく */
  .journey-img-wrap{margin:0 auto 10px;}
  .journey-drop{position:absolute;top:44%;left:8%;transform:translate(-50%,-50%);width:clamp(28px,5.6vw,46px);line-height:0;z-index:4;pointer-events:none;transition:left .7s cubic-bezier(.45,.05,.3,1);filter:drop-shadow(0 2px 4px rgba(0,0,0,.5));animation:dropBob 1.1s ease-in-out infinite;}
  .journey-drop svg{width:100%;height:auto;display:block;}
  .journey-drop #dropPath{transition:fill .6s ease;}
  @keyframes dropBob{0%,100%{margin-top:0}50%{margin-top:-8px}}
  .journey-caption{font-weight:900;color:var(--mizu-fuka);font-size:clamp(15px,2vw,22px);margin:2px 0 14px;}
</style>
</head>
<body>
  <header>
    <div class="mon">
      <span class="mon-maru">豊</span>
      <div>
        <h1>浄水場</h1>
        <div class="sub">水が できるまで　ものしり問答</div>
      </div>
      <span class="mon-maru">井</span>
    </div>
  </header>

  <main>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-mode="qa">ものしり問答</button>
      <button class="tab" data-mode="journey">水のたび</button>
      <button class="tab" data-mode="flow">ながれ図</button>
      <button class="tab" data-mode="quiz">クイズ</button>
    </nav>
    <div class="stage">
      <div class="person">
        <div class="face" id="face">
          <img class="mouth closed" src="https://raw.githubusercontent.com/byakusen/ttgheoge.jousuijou/main/jousuijou.png" alt="浄水場で働く人"
               onerror="this.closest('.face').classList.add('no-img');">
          <img class="mouth open" src="https://raw.githubusercontent.com/byakusen/ttgheoge.jousuijou/main/jopusuijou2.png" alt="" aria-hidden="true">
          <span class="face-fallback">浄水場<br>の人</span>
        </div>
        <div class="name-tag">浄水場の人</div>
      </div>
      <div class="scroll">
        <div class="answer" id="answer"></div>
      </div>
    </div>

    <div class="panel show" id="panel-qa">
      <div class="ask-zone">
        <div class="label">▼ じょうすいじょうの人に きいてみよう</div>
        <div class="input-row">
          <input id="q" type="text" placeholder="しつもんを 入力してね（れい：フロックって なに？）" autocomplete="off">
          <button class="btn-ask" id="askBtn">きく</button>
        </div>
        <div class="topics">
          <div class="t-label">▼ こんな しつもんは どうかな？（タップしてもOK）</div>
          <div class="chips" id="chips"></div>
        </div>
      </div>
    </div>

    <!-- クイズ -->
    <div class="panel" id="panel-quiz">
      <div class="quiz-zone">
        <div class="quiz-status">
          <span id="quizProg">第1問 / 全10問</span>
          <span id="quizScore">せいかい 0こ</span>
        </div>
        <div class="quiz-choices" id="quizChoices"></div>
        <button class="quiz-next hidden" id="quizNext">つぎへ ▶</button>
      </div>
    </div>

    <!-- ながれ図（処理の流れ） -->
    <div class="panel" id="panel-flow">
      <div class="flow-zone">

// 入力にいちばん合う答えをさがす
function findAnswer(text){
  const t = (text||"").replace(/\s/g,"");
  if(!t) return null;
  let best=null, bestScore=0;
  for(const item of KB){
    let score=0;
    for(const k of item.keys){ if(t.includes(k)) score += k.length; }
    if(score>bestScore){bestScore=score; best=item;}
  }
  return bestScore>0 ? best.a : null;
}

  "むむ、それについては こたえを 持っていないんだ。べつの 言い方で、もういちど たずねてみてね。",
  "はてな、聞きおぼえの ない しつもんだなぁ。『浄水処理の 流れ』や『配水池』の ことなら、いくらでも 話してあげられるよ！"
];

const GREET = "こんにちは！ わたしは 豊井浄水場（とよいじょうすいじょう）で はたらいている 人だよ。みんなが まいにち つかう 水道水（すいどうすい）が、どうやって つくられているか、なんでも きいてね。下の ますに しつもんを 入力して、リターンを おすか「きく」ボタンを おしてみよう！";

// ===== タイプライター表示 =====
const answerEl = document.getElementById('answer');
const faceEl = document.getElementById('face');
let typing=null;
let mouthTimer=null;
function startMouth(){
  stopMouth();
  // 口を開いた絵と閉じた絵をすばやく切り替えて「ぱくぱく」させる
  mouthTimer=setInterval(()=>{ faceEl.classList.toggle('talking-open'); },130);
}
function stopMouth(){
  if(mouthTimer){ clearInterval(mouthTimer); mouthTimer=null; }
  faceEl.classList.remove('talking-open'); // 話し終わりは口を閉じた絵にもどす
}
function speak(text, mood){
  faceEl.classList.remove('seikai'); void faceEl.offsetWidth;
  if(mood) faceEl.classList.add(mood);
  startMouth();
  if(typing) clearInterval(typing);
  answerEl.innerHTML="";
  let i=0;
  typing=setInterval(()=>{
    if(i>=text.length){clearInterval(typing); stopMouth(); return;}
    answerEl.appendChild(document.createTextNode(text[i]));
    i++;
  },32);
}

function handleAsk(text){
  const a = findAnswer(text);
  if(a){ speak(a,'seikai'); }
  else{ speak(NOT_FOUND[Math.floor(Math.random()*NOT_FOUND.length)]); }
}

// ===== おすすめ問いチップ =====
const SUGGESTIONS = [
  "水はどこからくるの？","フロックって なに？","ろ過池の しごとは？",
  "天理市の 水源は？","なぜ消毒するの？","配水池って なに？",
  "薬を 入れて 大丈夫？","1日に どれくらい つくれる？"
];
const chipsEl=document.getElementById('chips');
SUGGESTIONS.forEach(s=>{
  const b=document.createElement('button');
  b.className='chip'; b.type='button'; b.textContent=s;
  b.onclick=()=>{ qEl.value=s; handleAsk(s); };
  chipsEl.appendChild(b);
});

// ===== 入力イベント =====
const qEl=document.getElementById('q');

// IME（日本語入力）の変換確定中かどうかを記録する
let composing=false;
qEl.addEventListener('compositionstart',()=>{ composing=true; });
qEl.addEventListener('compositionend',()=>{ composing=false; });

document.getElementById('askBtn').onclick=()=>handleAsk(qEl.value);
qEl.addEventListener('keydown',e=>{
  // 漢字変換などの確定リターンでは送信しない。
  // 変換が確定し、ふつうにリターンを押したときだけ質問を送る。
  if(e.key==='Enter' && !composing && !e.isComposing){
    handleAsk(qEl.value);
  }
});

// ===== モード切りかえ（タブ） =====
const panels={qa:'panel-qa',quiz:'panel-quiz',flow:'panel-flow',journey:'panel-journey'};
const FLOW_INTRO="これは 豊井浄水場の「ながれの 図」だよ。天理ダムの 水は、左から 右へ すすむうちに、だんだん きれいに なっていくんだ。下の ①〜⑥の ボタンを じゅんに おすと、その 池の せつめいと、コップの 水の ようすが 見られるよ！";
function setMode(m){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.mode===m));
  Object.values(panels).forEach(id=>document.getElementById(id).classList.remove('show'));
  document.getElementById(panels[m]).classList.add('show');
  if(m==='quiz') startQuiz();
  else if(m==='flow'){ buildFlow(); speak(FLOW_INTRO); }
  else if(m==='journey'){ jIdx=0; renderJourney(); }
  else speak(GREET);
}
document.querySelectorAll('.tab').forEach(t=>{ t.onclick=()=>setMode(t.dataset.mode); });

// ===== クイズ =====
const QUIZ=[
  {q:"よごれが くっついて できた 大きな かたまりを 何という？", c:["フロック","プランクトン","シャボン"], a:0, ex:"小さな よごれが くっついて 大きく なった かたまりだよ。"},
  {q:"水の よごれを 固める ために 入れる 薬「PAC」の はたらきは？", c:["色を つける","よごれを くっつける","あまくする"], a:1, ex:"よごれを くっつけて 固める 凝集剤（ぎょうしゅうざい）なんだ。"},
  {q:"ばいきんを やっつける ために 入れる 薬は？", c:["さとう","次亜塩素酸ナトリウム","しお"], a:1, ex:"水の 中の ばいきんを やっつける 消毒剤だよ。"},
  {q:"フロックを 池の そこに しずめて とる 池は？", c:["ろ過池","沈でん池","配水池"], a:1, ex:"フロックが しずんで、上の 水が きれいに なるんだ。"},
  {q:"ろ過池では 何を 使って 小さな よごれを とる？", c:["すな","あみ","じしゃく"], a:0, ex:"砂の つぶの すきまで、小さな よごれが とれるんだよ。"},
  {q:"できあがった 水道水を いったん ためておく 池は？", c:["着水井","配水池","排泥池"], a:1, ex:"ここに ためてから、みんなの 家へ 配水されるんだ。"},
  {q:"豊井浄水場の 水源（水の もと）は どこ？", c:["天理ダム","海","プール"], a:0, ex:"豊井浄水場は 天理ダムの 水を きれいに しているよ。"},
  {q:"天理市の 水源は いくつ ある？", c:["1つ","3つ","10こ"], a:1, ex:"県営水道・天理ダム・地下水の 3つだよ。"},
  {q:"高い 場所の 家まで 水を おし上げる 施設は？", c:["ポンプ場","ダム","学校"], a:0, ex:"水に 力を かけて、高い ところへ おし上げるんだ。"},
  {q:"水道水が できるまで、いちばん さいしょに 水が 入る 場所は？", c:["着水井","ろ過池","配水池"], a:0, ex:"原水（ダムの 水）が さいしょに 入ってくる 場所だよ。"}
];
let quizOrder=[], qPos=0, qScore=0;
const elProg=document.getElementById('quizProg'), elScore=document.getElementById('quizScore'),
      elChoices=document.getElementById('quizChoices'), elNext=document.getElementById('quizNext');
function startQuiz(){
  quizOrder=[...Array(QUIZ.length).keys()].sort(()=>Math.random()-0.5);
  qPos=0; qScore=0;
  showQuestion();
}
function showQuestion(){
  elNext.classList.add('hidden');
  const item=QUIZ[quizOrder[qPos]];
  elProg.textContent=`第${qPos+1}問 / 全${QUIZ.length}問`;
  elScore.textContent=`せいかい ${qScore}こ`;
  speak(`第${qPos+1}問！ ${item.q}`);
  elChoices.innerHTML="";
  item.c.forEach((txt,i)=>{
    const b=document.createElement('button');
    b.className='choice'; b.textContent=txt;
    b.onclick=()=>answer(i,b);
    elChoices.appendChild(b);
  });
}
function answer(i,btn){
  const item=QUIZ[quizOrder[qPos]];
  [...elChoices.children].forEach(b=>b.disabled=true);
  if(i===item.a){
    btn.classList.add('correct'); qScore++;
    speak("せいかい！ "+item.ex,'seikai');
  }else{
    btn.classList.add('wrong');
    elChoices.children[item.a].classList.add('correct');
    speak(`おしい！ 正かいは「${item.c[item.a]}」だよ。`+item.ex);
  }
  elScore.textContent=`せいかい ${qScore}こ`;
  elNext.textContent = (qPos===QUIZ.length-1) ? "けっかを 見る ▶" : "つぎへ ▶";
  elNext.classList.remove('hidden');
}
elNext.onclick=()=>{
  qPos++;
  if(qPos>=QUIZ.length) showResult();
  else showQuestion();
};
function showResult(){
  elChoices.innerHTML=""; elNext.classList.add('hidden');
  elProg.textContent=`おわり / 全${QUIZ.length}問`;
  let msg;
  if(qScore===QUIZ.length) msg=`ぜんぶ せいかい！ ${qScore}こ／${QUIZ.length}こ。きみは もう 水はかせだ！`;
  else if(qScore>=7) msg=`${qScore}こ／${QUIZ.length}こ せいかい！ すごい、よく 知っているね！`;
  else if(qScore>=4) msg=`${qScore}こ／${QUIZ.length}こ せいかい。いい ちょうし！ もう一回 やると もっと わかるよ。`;
  else msg=`${qScore}こ／${QUIZ.length}こ。だいじょうぶ、「ものしり問答」で べんきょうして、もう一回 ちょうせんしてみよう！`;
  speak(msg,'seikai');
  const b=document.createElement('button');
  b.className='choice'; b.textContent="もう一回 ちょうせんする 🔁";
  b.onclick=startQuiz;
  elChoices.appendChild(b);
}

// ===== ながれ図（処理の流れ） =====
const FLOW=[
  {nm:"着水井", c:21.5, s:19, e:24, color:"#9c7b4a", nigori:"とても にごっている", ex:"天理ダムの 水が さいしょに 入ってくる 場所。よごれを とる 薬「PAC」を 入れるよ。"},
  {nm:"薬品混和池", c:29.5, s:26, e:33, color:"#a8884e", nigori:"にごっている", ex:"薬と 水を よ〜く 混ぜる 池。ばいきんを やっつける 消毒剤も 入れるよ。"},
  {nm:"フロック形成池", c:40, s:34, e:46, color:"#b6a05f", nigori:"よごれが かたまってきた", ex:"よごれが くっついて「フロック」という 大きな かたまりに なるよ。"},
  {nm:"沈でん池", c:53, s:47, e:59, color:"#8fbf9f", nigori:"だいぶ きれい", ex:"フロックが 池の そこに しずんで、上の 水が きれいに なるよ。"},
  {nm:"ろ過池", c:66.5, s:60, e:73, color:"#86cdde", nigori:"ほぼ すきとおった", ex:"砂の 中を 通して、目に 見えない 小さな よごれまで とるよ。"},
  {nm:"配水池", c:79.5, s:74, e:85, color:"#7fd0ec", nigori:"すきとおって きれい！", ex:"できあがった きれいな 水道水を ためておく 池。ここから みんなの 家へ！"}
];
const flowTrack=document.getElementById('flowTrack'),
      flowLiquid=document.getElementById('flowLiquid'),
      flowLabel=document.getElementById('flowLabel'),
      flowImgWrap=document.getElementById('flowImgWrap'),
      flowBand=document.getElementById('flowBand'),
      flowBandLabel=document.getElementById('flowBandLabel');
let flowPins=[];
function selectStage(i){
  const s=FLOW[i];
  flowPins.forEach((p,j)=>p.classList.toggle('active',j===i));
  [...flowTrack.children].forEach((c,j)=>c.classList.toggle('active',j===i));
  flowBand.style.left=s.s+'%';
  flowBand.style.width=(s.e-s.s)+'%';
  flowBandLabel.textContent=`${i+1}　${s.nm}`;
  flowBand.classList.add('show');
  flowLiquid.style.background=s.color;
  flowLabel.textContent=`水の よごれ：${s.nigori}`;
  speak(`【${i+1}　${s.nm}】 ${s.ex}`);
}
function buildFlow(){
  // イラスト上の番号ピン
  flowImgWrap.querySelectorAll('.flow-pin').forEach(p=>p.remove());
  flowPins=[];
  FLOW.forEach((s,i)=>{
    const pin=document.createElement('button');
    pin.className='flow-pin'; pin.textContent=i+1; pin.style.left=s.c+'%';
    pin.title=s.nm; pin.onclick=()=>selectStage(i);
    flowImgWrap.appendChild(pin); flowPins.push(pin);
  });
  // 下のボタン
  flowTrack.innerHTML="";
  FLOW.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='flow-step';
    d.innerHTML=`<span class="num">${i+1}</span><div class="nm">${s.nm}</div>`;
    d.onclick=()=>selectStage(i);
    flowTrack.appendChild(d);
  });
  // リセット
  flowBand.classList.remove('show');
  flowPins.forEach(p=>p.classList.remove('active'));
  flowLiquid.style.background="#9c7b4a";
  flowLabel.textContent="水の よごれ：①〜⑥を おしてみよう";
}

// ===== 水のたび =====
const JOURNEY=[
  {x:8,  color:"#9c7b4a", cap:"天理ダム", t:"やあ、ぼくは 水の つぶ。いまは 天理ダムの 中に いるよ。見て、まだ 茶色く にごっているでしょ？ これから みんなの 飲み水に なる 旅に 出るんだ！"},
  {x:16, color:"#9c7b4a", cap:"導水路（はこばれ中）", t:"導水路（どうすいろ）という ながい 通り道を 通って、豊井浄水場へ しゅっぱつ！ 609mも あるんだって。まだ にごったままだよ。"},
  {x:21.5, color:"#a8884e", cap:"① 着水井", t:"着水井に とうちゃく。あれ、PACって いう 薬を 入れられた！ ぼくの まわりの よごれが、くっつき始めたぞ。"},
  {x:29.5, color:"#b6a05f", cap:"② 薬品混和池", t:"薬品混和池で ぐるぐる 混ぜられる。ばいきんを やっつける 消毒剤も 入ったよ。"},
  {x:40, color:"#b09a55", cap:"③ フロック形成池", t:"フロック形成池で、まわりの よごれが あつまって「フロック」という 大きな かたまりに なったよ。"},
  {x:53, color:"#8fbf9f", cap:"④ 沈でん池", t:"沈でん池では、その フロックが しずんでいく…。わぁ、ぼくの まわりが きゅうに きれいに なってきた！"},
  {x:66.5, color:"#86cdde", cap:"⑤ ろ過池", t:"ろ過池の 砂（すな）の 中を、ゆっくり 通りぬける。目に 見えない 小さな よごれも、ここで さようなら。だいぶ すきとおってきた！"},
  {x:73, color:"#7fd0ec", cap:"消毒（しょうどく）", t:"もう一度 消毒されて、ぼくは すっかり 安全な 水道水に なったよ！ ほら、こんなに すきとおった 水色に なった。もう そのまま 飲めるんだ。"},
  {x:79.5, color:"#7fd0ec", cap:"⑥ 配水池", t:"配水池で ひとやすみ。ここから、みんなの 家へ 出発の じゅんびを するよ。"},
  {x:93, color:"#5ec3ea", cap:"みんなの 家へ！", t:"水道管を 通って…じゃ口から こんにちは！ コップに そそがれて、きみに 飲んでもらえる。長い 旅、見てくれて ありがとう！"}
];
let jIdx=0;
const jProg=document.getElementById('journeyProg'),
      jPrev=document.getElementById('journeyPrev'),
      jNext=document.getElementById('journeyNext'),
      jDrop=document.getElementById('journeyDrop'),
      jCap=document.getElementById('journeyCap'),
      dropPath=document.getElementById('dropPath');
function renderJourney(){
  const s=JOURNEY[jIdx];
  jDrop.style.left=s.x+'%';
  dropPath.style.fill=s.color;
  jCap.textContent=s.cap;
  jProg.textContent=`場面 ${jIdx+1} / ${JOURNEY.length}`;
  jPrev.style.visibility = jIdx===0 ? 'hidden' : 'visible';
  jNext.textContent = jIdx===JOURNEY.length-1 ? "さいしょへ 🔁" : "つぎへ ▶";
  speak(s.t);
}
jPrev.onclick=()=>{ if(jIdx>0){ jIdx--; renderJourney(); } };
jNext.onclick=()=>{ if(jIdx<JOURNEY.length-1){ jIdx++; } else { jIdx=0; } renderJourney(); };

// 水のたびのイラストは ながれ図と同じ画像を使う（重複なし）
document.getElementById('journeyImg').src=document.querySelector('#flowImgWrap img').src;

// 最初のあいさつ（ものしり問答モード）
speak(GREET);
</script>
